<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:title" content="ReverseSec">
  <meta property="og:description" content="We are a small group of researchers who just like to break security.">
  <meta property="og:image" content="https://reversesec.org/assets/banner.png">
  <meta property="og:url" content="https://reversesec.org/">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ReverseSec">
  <meta name="twitter:description" content="We are a small group of researchers who just like to break security.">
  <meta name="twitter:image" content="https://reversesec.org/assets/banner.png">

  <title>ReverseSec</title>

  <link rel="icon" href="/assets/logo.png" type="image/png">

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: #fff;
      background: #0a0a0a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: #0a0a0a;
      color: #fff;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      opacity: 0.85;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: center;
      padding-bottom: 2rem;
    }

    .logo {
      width: 40px;
      height: auto;
      display: block;
    }

    .content {
      width: min(520px, 100%);
      margin: 0 auto;
      text-align: left;
    }

    .text {
      max-width: 53ch;
      font-family: Georgia, Cambria, "Times New Roman", serif;
      font-size: 1rem;
      color: #e8e5df;
    }

    .intro {
      line-height: 2.1;
      color: #f4f3ee;
      margin-bottom: 1.4rem;
    }

    .description {
      line-height: 2.25;
      margin-bottom: 1.4rem;
    }

    .contact {
      line-height: 1.6;
    }

    .contact a {
      border-bottom: 1px solid rgba(232, 229, 223, 0.4);
      padding-bottom: 0.08em;
    }

    @media (max-width: 720px) {
      .header {
        padding-bottom: 1.5rem;
      }

      .logo {
        width: 36px;
      }
    }
  </style>

</head>

<body>
  <div class="page">
    <header class="header">
      <img src="/assets/logo.png" alt="ReverseSec logo" class="logo">
    </header>

<main class="content">
  <p class="text intro">
    <em>ReverseSec</em> is a security research team. We are a small group
    of researchers who just like to break security.
  </p>

  <p class="text description">
    We focus on reverse engineering and vulnerability research, identifying vulnerabilities across public and private sector systems.
  </p>

  <p class="text contact">
    <a href="mailto:reversesec@proton.me">Shoot us an email</a>
  </p>
</main>

  </div>
</body>
</html>
